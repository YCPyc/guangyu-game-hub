services:
  # Static hosting of the built site (dist/), copied to ./site on the server by deploy.sh.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Your domain (gets automatic HTTPS), or leave empty to serve plain HTTP on the server IP.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data

volumes:
  caddy_data:
